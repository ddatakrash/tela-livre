# Configuracoes do Tela Livre. Copie este arquivo para config.properties, edite e rode instalar.bat de novo.
# Sem config.properties, a cidade, a moeda e a regiao vem do fuso horario da TV.

# Chave gratuita do TMDB (themoviedb.org > Configuracoes > API), para os filmes e series em alta.
# Ela e sua: fica so no seu PC e na sua TV.
tmdb_key=

# Seu pais (duas letras): decide quais titulos estao em quais apps.
tmdb_region=BR

# Sua cidade, para o clima e para o modo noturno seguir o por do sol (graus decimais).
latitude=-23.5505
longitude=-46.6333
city=Sao Paulo

# true deixa desenhos e animes fora dos destaques.
hide_animation=false

# auto (segue a TV) ou um idioma: pt, en, es...
language=pt

# true mostra precos de criptomoedas na tela inicial e no descanso de tela.
show_crypto=false
currency=BRL

# C, F ou auto
temperature=C

# Visual: auto (escuro do por do sol ao nascer do sol), light ou dark
theme=auto

# Apps para esconder da fileira e dos destaques, separados por virgula (parte do nome serve).
hide_apps=

# Apps da fileira, nesta ordem, separados por virgula (parte do nome serve).
shelf_apps=

# App que abre sozinho quando a TV liga (parte do nome serve), ex: youtube. Vazio fica na tela inicial.
# Ao sair dele (botao Voltar), aparece a tela inicial normalmente.
startup_app=

# Opcional: chave gratuita do Watchmode (watchmode.com) faz o destaque abrir a pagina do titulo no app.
watchmode_key=
